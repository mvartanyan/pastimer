apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pastimer
resources:
  - ../k3s
  - ingress.yaml
images:
  - name: pastimer
    newName: docker.io/library/pastimer
    newTag: commit-f3fe9a915567163acf0c7ec71047002c51377a91-amd64
patches:
  - target:
      kind: PersistentVolumeClaim
      name: pastimer-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
