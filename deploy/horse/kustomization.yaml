apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pastimer
resources:
  - ../k3s
  - ingress.yaml
images:
  - name: pastimer
    newName: docker.io/library/pastimer
    newTag: commit-06354f6c20a7cf2f922606c24369dec47b87efe8-amd64
patches:
  - target:
      kind: PersistentVolumeClaim
      name: pastimer-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
