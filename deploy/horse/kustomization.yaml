apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pastimer
resources:
  - ../k3s
  - ingress.yaml
images:
  - name: pastimer
    newName: docker.io/library/pastimer
    newTag: commit-8458703b506fa31fd9ffab4f2d2455fe1a2af2ef-amd64
patches:
  - target:
      kind: PersistentVolumeClaim
      name: pastimer-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
