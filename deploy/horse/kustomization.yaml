apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pastimer
resources:
  - ../k3s
  - ingress.yaml
images:
  - name: pastimer
    newName: docker.io/library/pastimer
    newTag: commit-29337b633c96b0b2bd159e52ea86f2851f5b8a6b-amd64
patches:
  - target:
      kind: PersistentVolumeClaim
      name: pastimer-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
