apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pastimer
resources:
  - ../k3s
  - ingress.yaml
images:
  - name: pastimer
    newName: docker.io/library/pastimer
    newTag: commit-5517348481d3cab2afddc221e0ba3798d38762cf-amd64
patches:
  - target:
      kind: PersistentVolumeClaim
      name: pastimer-data
    patch: |-
      - op: add
        path: /spec/storageClassName
        value: local-path
