apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: https-redirect
spec:
  redirectScheme:
    scheme: https
    permanent: true
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: pastimer-tls
spec:
  secretName: pastimer-tls
  dnsNames:
    - 1000.vartanyan.com
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pastimer
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: pastimer-https-redirect@kubernetescrd
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - 1000.vartanyan.com
      secretName: pastimer-tls
  rules:
    - host: 1000.vartanyan.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: pastimer
                port:
                  name: http
